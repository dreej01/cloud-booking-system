apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "BookingDb"
            - name: MYSQL_USER
              value: "BookingUser"
            - name: MYSQL_PASSWORD
              value: "BookingPassword"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: bookingdb
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          image: mkr30/booking:1.0.0
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              value: "bookingdb"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "BookingUser"
            - name: DB_PASSWORD
              value: "BookingPassword"
            - name: DB_NAME
              value: "BookingDb"

---
apiVersion: v1
kind: Service
metadata:
  name: booking
spec:
  type: NodePort
  selector:
    app: booking
  ports:
    - port: 80
      targetPort: 5001
      nodePort: 30001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkin
  template:
    metadata:
      labels:
        app: checkin
    spec:
      containers:
        - name: checkin
          image: mkr30/checkin:1.0.0
          ports:
            - containerPort: 5002
          env:
            - name: DB_HOST
              value: "bookingdb"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "BookingUser"
            - name: DB_PASSWORD
              value: "BookingPassword"
            - name: DB_NAME
              value: "BookingDb"

---
apiVersion: v1
kind: Service
metadata:
  name: checkin
spec:
  type: NodePort
  selector:
    app: checkin
  ports:
    - port: 80
      targetPort: 5002
      nodePort: 30002
